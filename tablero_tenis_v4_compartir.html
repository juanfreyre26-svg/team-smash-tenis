<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tablero de Tenis v3</title><style>
*{box-sizing:border-box}body{margin:0;background:#07111f;color:#f5f7fb;font-family:Arial,sans-serif}.wrap{max-width:900px;margin:auto;padding:16px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:12px}h1{margin:0;font-size:24px}.status{font-size:11px;color:#35d07f;font-weight:800}.board,.config,.history{background:#0d1b2d;border:1px solid #29435f;border-radius:18px;padding:16px}.config,.history{background:#102137;margin-bottom:14px}.config h2,.history h2{font-size:13px;margin:0 0 10px}.grid,.names{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}label{display:block;color:#91a6bd;font-size:11px;font-weight:bold;margin:0 0 5px}select,input{width:100%;padding:11px;border-radius:10px;border:1px solid #29435f;background:#14263c;color:#fff;font-size:15px}.apply{width:100%;margin-top:10px;background:#2f8cff;color:#fff;border:0;border-radius:10px;padding:12px;font-weight:900}.players{margin-top:15px;border-top:1px solid #29435f}.player{display:grid;grid-template-columns:1fr 70px 80px;gap:8px;align-items:center;border-bottom:1px solid #29435f;padding:14px 0}.name{font-size:18px;font-weight:900;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.server{font-size:10px;color:#35d07f}.num{text-align:center;font-size:27px;font-weight:900}.caption{color:#91a6bd;font-size:11px;font-weight:bold;text-transform:uppercase;margin:15px 0 5px}.score{display:grid;grid-template-columns:1fr 100px;gap:8px;padding:5px 0}.points{background:#14263c;border-radius:12px;padding:11px;text-align:center;font-size:29px;font-weight:900}.message{margin:12px 0;padding:12px;border-radius:12px;background:#3b3118;border:1px solid #806b2b;color:#ffe08a;text-align:center;font-weight:900}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:15px}button{min-height:50px;border-radius:11px;font-weight:900;cursor:pointer}.point{background:#35d07f;color:#06150d;border:0}.point:disabled{opacity:.4;cursor:not-allowed}.tools{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px}.tools button{background:#14263c;color:#fff;border:1px solid #29435f}.history-head,.set-row{display:grid;grid-template-columns:70px 1fr 1fr;gap:8px}.history-head{color:#91a6bd;font-size:10px;font-weight:bold;text-transform:uppercase;padding-bottom:7px}.set-row{border-top:1px solid #29435f;padding:10px 0;font-weight:800}.final{margin-top:12px;padding:14px;border-radius:12px;background:#14263c;text-align:center;font-weight:900}.final small{display:block;color:#91a6bd;margin-top:5px}.footer{display:flex;justify-content:space-between;color:#91a6bd;font-size:11px;margin-top:13px}@media(max-width:560px){.wrap{padding:10px}.grid,.names{grid-template-columns:1fr}.player{grid-template-columns:1fr 55px 65px}.name{font-size:16px}.score{grid-template-columns:1fr 80px}.points{font-size:26px}.tools{grid-template-columns:1fr 1fr}.top{align-items:flex-start;flex-direction:column}.history-head,.set-row{grid-template-columns:55px 1fr 1fr}}
</style></head><body><div class="wrap"><div class="top"><div><h1>🎾 TABLERO DE TENIS</h1><div class="status" id="status">● LISTO</div></div><div id="serve">SAQUE: JUGADOR 1</div></div><div class="board">
<div class="config"><h2>⚙️ CONFIGURACIÓN</h2><div class="grid"><div><label>40 - 40</label><select id="deuce"><option value="decisive">Punto decisivo</option><option value="advantage">Con ventaja</option></select></div><div><label>Games para ganar el set</label><select id="games"><option>4</option><option>5</option><option selected>6</option><option>8</option></select></div><div><label>Tie-break</label><select id="tb"><option value="0">Sin tie-break</option><option value="5">A 5 puntos</option><option value="7" selected>A 7 puntos</option><option value="10">A 10 puntos</option></select></div><div><label>Sets para ganar</label><select id="sets"><option value="1">1 set</option><option value="2" selected>2 sets</option><option value="3">3 sets</option></select></div></div><button class="apply" id="apply">✓ APLICAR CONFIGURACIÓN Y REINICIAR</button></div>
<div class="names"><div><label>Jugador 1</label><input id="name1" value="Jugador 1"></div><div><label>Jugador 2</label><input id="name2" value="Jugador 2"></div></div>
<div class="players"><div class="player"><div class="name" id="n1">Jugador 1</div><div class="num" id="set1">0</div><div class="num" id="game1">0</div></div><div class="player"><div class="name" id="n2">Jugador 2</div><div class="num" id="set2">0</div><div class="num" id="game2">0</div></div></div>
<div class="caption">Juego actual</div><div class="score"><div class="name" id="pn1">Jugador 1</div><div class="points" id="pt1">0</div></div><div class="score"><div class="name" id="pn2">Jugador 2</div><div class="points" id="pt2">0</div></div><div class="message" id="message" style="display:none"></div>
<div class="buttons"><button class="point" id="add1">+ PUNTO JUGADOR 1</button><button class="point" id="add2">+ PUNTO JUGADOR 2</button></div><div class="tools"><button id="undo">↩ Deshacer</button><button id="serveBtn">🎾 Cambiar saque</button><button id="shareBtn">📤 Compartir marcador</button><button id="newBtn">🔄 Nuevo partido</button></div>
<div class="history"><h2>📋 HISTORIAL DE SETS</h2><div class="history-head"><div>Set</div><div id="hname1">Jugador 1</div><div id="hname2">Jugador 2</div></div><div id="setHistory"></div><div class="final" id="final" style="display:none"></div></div>
<div class="footer"><span id="rules"></span><span id="best"></span></div></div></div>
<script>
const state={points:[0,0],games:[0,0],sets:[0,0],server:0,tb:false,tbPoints:[0,0],finished:false,setHistory:[],history:[]};const $=id=>document.getElementById(id);const pv=[0,15,30,40];
function cfg(){return{deuce:$('deuce').value,games:+$('games').value,tb:+$('tb').value,sets:+$('sets').value}}function names(){return[$('name1').value.trim()||'Jugador 1',$('name2').value.trim()||'Jugador 2']}
function snap(){state.history.push({points:[...state.points],games:[...state.games],sets:[...state.sets],server:state.server,tb:state.tb,tbPoints:[...state.tbPoints],finished:state.finished,setHistory:state.setHistory.map(x=>({...x}))});if(state.history.length>30)state.history.shift()}
function reset(){state.points=[0,0];state.games=[0,0];state.sets=[0,0];state.server=0;state.tb=false;state.tbPoints=[0,0];state.finished=false;state.setHistory=[];state.history=[];render()}
function finishSet(w){state.setHistory.push({number:state.setHistory.length+1,score:[...state.games],winner:w,tbScore:null});state.sets[w]++;state.games=[0,0];state.points=[0,0];state.tb=false;state.tbPoints=[0,0];state.server=1-state.server;if(state.sets[w]>=cfg().sets)state.finished=true}
function winGame(w){const c=cfg();state.games[w]++;state.points=[0,0];state.server=1-state.server;if(c.tb&&state.games[0]===c.games&&state.games[1]===c.games){state.tb=true;state.tbPoints=[0,0];return}if((state.games[0]>=c.games||state.games[1]>=c.games)&&Math.abs(state.games[0]-state.games[1])>=2)finishSet(w)}
function point(i){if(state.finished)return;snap();const c=cfg();if(state.tb){state.tbPoints[i]++;if(state.tbPoints[i]>=c.tb&&state.tbPoints[i]-state.tbPoints[1-i]>=2){const tbScore=[...state.tbPoints];state.games[i]++;finishSet(i);state.setHistory[state.setHistory.length-1].tbScore=tbScore;}render();return}if(c.deuce==='decisive'&&state.points[0]===3&&state.points[1]===3){winGame(i);render();return}if(c.deuce==='advantage'){if(state.points[0]===4){if(i===0)winGame(0);else state.points[0]=3;render();return}if(state.points[1]===4){if(i===1)winGame(1);else state.points[1]=3;render();return}if(state.points[0]===3&&state.points[1]===3){state.points[i]=4;render();return}}state.points[i]++;if(state.points[i]>=4)winGame(i);render()}
function render(){const n=names(),c=cfg();$('n1').innerHTML='';$('n2').innerHTML='';$('n1').append(document.createTextNode(n[0]+' '));$('n2').append(document.createTextNode(n[1]+' '));for(const [id,show] of [['s1',state.server===0],['s2',state.server===1]]){const s=document.createElement('span');s.id=id;s.className='server';s.textContent='● SAQUE';s.style.display=show?'inline':'none';$(id==='s1'?'n1':'n2').appendChild(s)}$('pn1').textContent=n[0];$('pn2').textContent=n[1];$('hname1').textContent=n[0];$('hname2').textContent=n[1];$('add1').textContent='+ PUNTO '+n[0].toUpperCase();$('add2').textContent='+ PUNTO '+n[1].toUpperCase();$('set1').textContent=state.sets[0];$('set2').textContent=state.sets[1];$('game1').textContent=state.games[0];$('game2').textContent=state.games[1];$('serve').textContent='SAQUE: '+n[state.server].toUpperCase();if(state.tb){$('pt1').textContent=state.tbPoints[0];$('pt2').textContent=state.tbPoints[1];$('message').style.display='block';$('message').textContent='🔥 TIE-BREAK A '+c.tb}else{$('pt1').textContent=state.points[0]===4?'AD':pv[state.points[0]]||0;$('pt2').textContent=state.points[1]===4?'AD':pv[state.points[1]]||0;const d=c.deuce==='decisive'&&state.points[0]===3&&state.points[1]===3;$('message').style.display=d?'block':'none';$('message').textContent=d?'⚡ 40 - 40 · PUNTO DECISIVO':''}$('status').textContent=state.finished?'🏆 PARTIDO FINALIZADO':state.tb?'🔥 TIE-BREAK':'● PARTIDO EN JUEGO';$('add1').disabled=state.finished;$('add2').disabled=state.finished;$('rules').textContent=c.games+' games · '+(c.tb?'TB '+c.tb:'Sin TB')+' · '+(c.deuce==='decisive'?'Punto decisivo':'Ventaja');$('best').textContent='Mejor de '+c.sets;const box=$('setHistory');box.innerHTML='';if(!state.setHistory.length){box.innerHTML='<div style="color:#91a6bd;font-size:12px">Aún no hay sets terminados.</div>'}else state.setHistory.forEach(x=>{const r=document.createElement('div');r.className='set-row';r.innerHTML='<div>Set '+x.number+'</div><div>'+x.score[0]+(x.winner===0?' 🏆':'')+'</div><div>'+x.score[1]+(x.winner===1?' 🏆':'')+'</div>'+(x.tbScore?'<div style="grid-column:1/-1;color:#91a6bd;font-size:11px;margin-top:3px">Tie-break: '+x.tbScore[0]+'-'+x.tbScore[1]+'</div>':'');box.appendChild(r)});if(state.finished){const w=state.sets[0]>state.sets[1]?0:1;$('final').style.display='block';$('final').innerHTML='🏆 GANADOR: '+n[w]+'<small>Resultado final: '+state.sets[0]+' - '+state.sets[1]+' · '+state.setHistory.map(x=>x.score[0]+'-'+x.score[1]+(x.tbScore?' ('+x.tbScore[0]+'-'+x.tbScore[1]+')':'')).join(' | ')+'</small>'}else $('final').style.display='none'}

function shareText(){
 const n=names();
 let t='🎾 TABLERO DE TENIS - TEAM SMASH TENIS\n\n';
 t+=n[0]+' vs '+n[1]+'\n\n';
 if(state.setHistory.length){
  state.setHistory.forEach((x,i)=>{t+='Set '+(i+1)+': '+x.score[0]+'-'+x.score[1]; if(x.tbScore)t+=' (TB '+x.tbScore[0]+'-'+x.tbScore[1]+')'; t+='\n';});
 }
 if(state.finished){const w=state.sets[0]>state.sets[1]?0:1;t+='\n🏆 GANADOR: '+n[w]+'\n';t+='Resultado final: '+state.sets[0]+'-'+state.sets[1];}
 else {t+='\n🔥 PARTIDO EN JUEGO\n';t+='Games: '+state.games[0]+'-'+state.games[1]+'\n';if(state.tb)t+='Tie-break: '+state.tbPoints[0]+'-'+state.tbPoints[1]+'\n';else t+='Puntos: '+(state.points[0]===4?'AD':pv[state.points[0]])+'-'+(state.points[1]===4?'AD':pv[state.points[1]])+'\n';}
 return t;
}
async function shareMatch(){
 const text=shareText();
 if(navigator.share){try{await navigator.share({title:'Marcador de tenis',text:text});return;}catch(e){if(e&&e.name==='AbortError')return;}}
 const url='https://wa.me/?text='+encodeURIComponent(text);
 window.open(url,'_blank','noopener,noreferrer');
}

$('add1').onclick=()=>point(0);$('add2').onclick=()=>point(1);$('undo').onclick=()=>{if(!state.history.length)return;const x=state.history.pop();Object.assign(state,{points:[...x.points],games:[...x.games],sets:[...x.sets],server:x.server,tb:x.tb,tbPoints:[...x.tbPoints],finished:x.finished,setHistory:x.setHistory.map(a=>({...a,tbScore:a.tbScore?[...a.tbScore]:null}))});render()};$('serveBtn').onclick=()=>{if(!state.finished){state.server=1-state.server;render()}};
$('shareBtn').onclick=shareMatch;$('newBtn').onclick=reset;$('apply').onclick=reset;$('name1').oninput=render;$('name2').oninput=render;render();
</script></body></html>
